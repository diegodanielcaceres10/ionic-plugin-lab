<app-shell activePage="network">
  <app-ui-header
    title="Network"
    subtitle="Monitor connectivity using the Capacitor Network plugin."
    [pluginType]="pluginInfo()?.pluginType ? 'official' : 'community'"
    [isFavorited]="pluginInfo()?.isFavorited ?? false"
    (favoriteToggled)="toggleFavorite()"
  />

  <app-ui-banner
    class="banner-slot"
    [title]="bannerTitle()"
    [subtitle]="connectionTypeLabel()"
    [bannerIcon]="bannerIcon()"
    [variant]="variant()"
    [badge]="badgeLabel()"
    [badgeIcon]="badgeIcon()"
  />

  <section class="buttons">
    <app-ui-button
      text="Refresh Status"
      icon="refresh-outline"
      variant="outline"
      (buttonClick)="refresh()"
    />
    <app-ui-button
      [text]="isListening() ? 'Stop Listening' : 'Listen for Changes'"
      [icon]="isListening() ? 'stop-outline' : 'play-outline'"
      [disabled]="false"
      (buttonClick)="toggleListening()"
    />
  </section>

  <section class="info">
    <div class="info__header">
      <ion-icon name="information-circle-outline"></ion-icon>
      <h3>Network Information</h3>
    </div>

    <div class="info__row">
      <div class="info__label">
        <ion-icon name="pulse-outline"></ion-icon>
        <span>Connected</span>
      </div>
      <span class="info__value"
        >{{ status() ? (status()!.connected ? 'Yes' : 'No') : '—' }}</span
      >
    </div>

    <div class="info__row">
      <div class="info__label">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
        <span>Connection Type</span>
      </div>
      <span class="info__value">{{ status()?.connectionType ?? '—' }}</span>
    </div>

    <div class="info__row">
      <div class="info__label">
        <ion-icon name="time-outline"></ion-icon>
        <span>Listener</span>
      </div>
      <span class="info__value"
        >{{ isListening() ? 'Active' : 'Stopped' }}</span
      >
    </div>
  </section>

  <app-activity-log [entries]="activityLog()" />
</app-shell>
