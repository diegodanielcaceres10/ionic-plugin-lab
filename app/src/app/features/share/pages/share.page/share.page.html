<app-shell activePage="share">
  <app-ui-header
    title="Share"
    subtitle="Open the native share sheet using the Capacitor Share plugin."
    [pluginType]="pluginInfo()?.pluginType ? 'official' : 'community'"
    [isFavorited]="pluginInfo()?.isFavorited ?? false"
    (favoriteToggled)="toggleFavorite()"
  />

  @if (state() === 'checking') {
  <section class="card__empty">
    <ion-spinner name="circular" color="primary"></ion-spinner>
    <p>Checking share support...</p>
  </section>
  } @else if (state() === 'unsupported') {
  <section class="card__empty">
    <div class="card__icon card__icon--warning">
      <ion-icon name="alert-circle-outline"></ion-icon>
    </div>
    <h2>Sharing isn't supported here</h2>
    <p>
      This browser doesn't implement the Web Share API. Try this on a mobile
      device, or in a supported mobile browser.
    </p>
  </section>
  } @else {

  <section class="panel">
    <div class="panel__header">
      <ion-icon name="share-social-outline"></ion-icon>
      <h3>Share Content</h3>
    </div>

    <label class="field-label" for="share-message">Message</label>
    <textarea
      id="share-message"
      class="field"
      rows="3"
      [value]="message()"
      (input)="updateMessage($any($event.target).value)"
    ></textarea>

    <label class="field-label" for="share-url">Link (optional)</label>
    <input
      id="share-url"
      class="field"
      type="url"
      [value]="url()"
      (input)="updateUrl($any($event.target).value)"
    />
  </section>

  <section class="buttons">
    <app-ui-button
      text="Share"
      icon="share-social-outline"
      [disabled]="isSharing() || !message()"
      (buttonClick)="share()"
    />
  </section>

  }

  <app-activity-log [entries]="activityLog()" />
</app-shell>
