<app-shell activePage="clipboard">
  <app-ui-header
    title="Clipboard"
    subtitle="Copy and read content from the system clipboard."
  />

  <app-ui-banner
    title="Clipboard Content"
    [subtitle]="clipboard()?.category === 'image' ? 'Image data detected' : clipboard()?.value || 'Clipboard is empty'"
    [bannerIcon]="categoryIcon()"
    [badge]="categoryLabel()"
  />

  <section class="input-card">
    <div class="input-card__header">
      <ion-icon name="create-outline"></ion-icon>
      <h3>Demo Input</h3>
    </div>
    <ion-textarea
      [(ngModel)]="inputText"
      placeholder="Type something to copy, or paste clipboard content here…"
      autoGrow="true"
      rows="3"
    ></ion-textarea>
  </section>

  <section class="buttons">
    <app-ui-button
      text="Clear Input"
      icon="trash-outline"
      variant="outline"
      (buttonClick)="clearInput()"
    />
    <app-ui-button
      text="Paste into Input"
      icon="download-outline"
      variant="outline"
      (buttonClick)="pasteIntoInput()"
    />
  </section>

  <h3 class="section-title">Quick Actions</h3>
  <div class="actions-grid">
    @for (item of quickActions; track item.id) {
    <button class="action-card" (click)="item.action()">
      <div class="action-card__icon">
        <ion-icon [name]="item.icon"></ion-icon>
      </div>
      <span class="action-card__title">{{ item.title }}</span>
    </button>
    }
  </div>

  @if (infoExpanded()) {
  <section class="info">
    <div class="info__header">
      <ion-icon name="information-circle-outline"></ion-icon>
      <h3>Clipboard Info</h3>
    </div>

    <div class="info__row">
      <div class="info__label">
        <ion-icon [name]="categoryIcon()"></ion-icon><span>Detected Type</span>
      </div>
      <span class="info__value">{{ categoryLabel() }}</span>
    </div>
    <div class="info__row">
      <div class="info__label">
        <ion-icon name="code-slash-outline"></ion-icon
        ><span>Raw MIME Type</span>
      </div>
      <span class="info__value">{{ clipboard()?.rawType ?? '—' }}</span>
    </div>
    <div class="info__row">
      <div class="info__label">
        <ion-icon name="text-outline"></ion-icon><span>Character Count</span>
      </div>
      <span class="info__value">{{ characterCount() }}</span>
    </div>
    <div class="info__row">
      <div class="info__label">
        <ion-icon name="time-outline"></ion-icon><span>Last Read</span>
      </div>
      <span class="info__value">{{ timeLabel(lastReadAt()) }}</span>
    </div>
  </section>
  }
</app-shell>
