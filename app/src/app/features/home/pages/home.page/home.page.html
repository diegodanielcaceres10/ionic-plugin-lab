<app-shell activePage="home">
  <section class="welcome">
    <div class="welcome__text">
      <p class="welcome__greeting">Welcome!</p>
      <h1 class="welcome__title">Ionic Plugin Lab</h1>
      <h2 class="welcome__title">Explore, test, and learn</h2>
      <span class="welcome__divider"></span>
      <p class="welcome__subtitle">
        A Capacitor plugin lab to help you build better mobile experiences.
      </p>
    </div>
  </section>

  <section class="stats">
    <div class="stat__item" *ngFor="let stat of stats">
      <ion-icon [name]="stat.icon" [color]="stat.color"></ion-icon>
      <span class="stat__value">{{ stat.value }}</span>
      <span class="stat__label">{{ stat.label }}</span>
    </div>
  </section>

  <section class="plugins" *ngFor="let category of pluginCategories">
    <div class="plugins__header">
      <h2>{{ category.label }}</h2>
    </div>
    <div class="plugins__grid">
      <button
        class="plugins__card"
        [class.plugins__card--pending]="!plugin.link"
        *ngFor="let plugin of category.plugins"
        (click)="onPluginTap(plugin)"
      >
        <div class="plugins__icon" [class.plugins__icon-pending]="!plugin.link">
          <ion-icon [name]="plugin.icon"></ion-icon>
        </div>
        <span class="plugins__label">{{ plugin.label }}</span>
      </button>
    </div>
  </section>
</app-shell>
