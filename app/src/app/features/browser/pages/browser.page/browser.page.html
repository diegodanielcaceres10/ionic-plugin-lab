<app-shell activePage="browser">
  <app-ui-header
    title="Browser"
    subtitle="Open web pages using the Capacitor Browser plugin."
    [pluginType]="pluginInfo()?.pluginType ? 'official' : 'community'"
    [isFavorited]="pluginInfo()?.isFavorited ?? false"
    (favoriteToggled)="toggleFavorite()"
  />

  @if (isBrowserEnv()) {
  <section class="notice">
    <ion-icon name="information-circle-outline"></ion-icon>
    <span
      >You're in the browser: pages open in a new tab, which pop-up blockers may
      prevent.</span
    >
  </section>
  }

  <section class="quick-links">
    <div class="info__header">
      <ion-icon name="link-outline"></ion-icon>
      <h3>Quick Links</h3>
    </div>
    <div class="quick-links__grid">
      @for (link of quickLinks; track link.url) {
      <button
        type="button"
        class="quick-links__card"
        [disabled]="isBusy()"
        (click)="open(link.url)"
      >
        <span class="quick-links__icon" [style.color]="link.color">
          <ion-icon [name]="link.icon"></ion-icon>
        </span>
        <span class="quick-links__label">{{ link.label }}</span>
      </button>
      }
    </div>
  </section>

  <section class="custom">
    <div class="info__header">
      <ion-icon name="create-outline"></ion-icon>
      <h3>Custom URL</h3>
    </div>
    <input
      class="custom__input"
      type="url"
      [value]="customUrl()"
      (input)="onCustomUrlChange($event)"
      placeholder="https://example.com"
    />
    <app-ui-button
      text="Open Custom URL"
      icon="open-outline"
      [disabled]="isBusy() || !customUrl()"
      (buttonClick)="openCustom()"
    />
  </section>

  <section class="buttons">
    <app-ui-button
      text="Close Browser"
      icon="close-outline"
      variant="outline"
      [disabled]="isBusy() || !isOpen()"
      (buttonClick)="close()"
    />
  </section>

  <app-activity-log [entries]="activityLog()" />
</app-shell>
