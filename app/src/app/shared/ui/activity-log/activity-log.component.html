<section class="history">
  <div class="history__header">
    <ion-icon name="time-outline"></ion-icon>
    <h3>Activity Log</h3>
  </div>

  @if (entries().length === 0) {
    <p class="history__empty">No activity yet.</p>
  }

  @for (entry of entries(); track $index) {
    <div class="history__row">
      <span
        class="history__dot"
        [class]="'history__dot--' + entry.status"
      ></span>
      <span class="history__label">{{ entry.type }}</span>
      <span class="history__time">{{
        entry.createdAt | date: "HH:mm:ss"
      }}</span>
    </div>
  }
</section>
