services:
  web:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: ionic-plugin-lab-web
    working_dir: /app
    ports:
      - "5201:8100"
      - "7201:35729"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    tty: true
    stdin_open: true

  apk:
    build:
      context: .
      dockerfile: docker/apk/Dockerfile
    container_name: ionic-plugin-lab-apk
    volumes:
      - ./app:/app
    profiles: ["apk"]
